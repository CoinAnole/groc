# Default install-time config. Groc preserves user settings and refreshes only
# the marked model definitions so bridge overrides stay in sync.

[models]
default = "gpt-5.6-sol"

[subagents]
enabled = true

[features]
telemetry = false
lsp_tools = false

[memory]
enabled = false

# BEGIN GROC-MANAGED MODELS
[model."gpt-5.6-sol"]
model = "gpt-5.6-sol"
base_url = "http://127.0.0.1:11435/v1"
name = "GPT-5.6 Sol (ChatGPT OAuth)"
api_key = "local"
api_backend = "responses"
supports_reasoning_effort = true
context_window = 272000

[model."gpt-5.6-terra"]
model = "gpt-5.6-terra"
base_url = "http://127.0.0.1:11435/v1"
name = "GPT-5.6 Terra (ChatGPT OAuth)"
api_key = "local"
api_backend = "responses"
supports_reasoning_effort = true
context_window = 272000

