# Grok Build may make internal fallback requests under this model id.
# Keep those requests on Groc's local ChatGPT OAuth bridge instead of xAI auth.
[model."grok-build"]
model = "gpt-5.6-sol"
base_url = "http://127.0.0.1:11435/v1"
name = "Groc fallback via GPT-5.6 Sol (ChatGPT OAuth)"
api_key = "local"
api_backend = "responses"
supports_reasoning_effort = true
context_window = 272000

# END GROC-MANAGED MODELS
[ui]
max_thoughts_width = 120
fork_secondary_model = "gpt-5.6-sol"
yolo = false
compact_mode = false
